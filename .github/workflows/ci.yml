# ============================================================
# 脑卒中疾病管理医疗系统 — CI/CD Pipeline
# 触发: push 到 main, PR 到 main
# ============================================================
name: Stroke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 🔬 单元测试
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mariadb-admin ping -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: 🧪 运行单元测试
        run: mvn test -B -pl core-clinical,common
        env:
          JWT_SECRET: stroke-dev-jwt-secret-key-2026-must-be-256-bit

      - name: 📊 JaCoCo 覆盖率报告
        run: |
          mvn jacoco:report -B -pl core-clinical 2>/dev/null || true
          echo "覆盖率报告: core-clinical/target/site/jacoco/index.html"

  build:
    name: 🏗️ Docker 构建
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 GitHub Container Registry 登录
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ 构建后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}/stroke-platform:latest
            ${{ env.DOCKER_IMAGE }}/stroke-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}/stroke-frontend:latest
            ${{ env.DOCKER_IMAGE }}/stroke-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 部署
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 K8s 配置
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: 🚀 部署到 K8s
        run: |
          kubectl apply -f k8s/ --recursive
          kubectl set image deployment/stroke-platform \
            stroke-platform=${{ env.DOCKER_IMAGE }}/stroke-platform:${{ github.sha }} \
            -n stroke
          kubectl set image deployment/stroke-frontend \
            stroke-frontend=${{ env.DOCKER_IMAGE }}/stroke-frontend:${{ github.sha }} \
            -n stroke
          kubectl rollout status deployment/stroke-platform -n stroke --timeout=300s
          kubectl rollout status deployment/stroke-frontend -n stroke --timeout=300s
