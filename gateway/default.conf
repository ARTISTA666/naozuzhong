server {
    listen 8080;
    server_name localhost;

    # core-clinical: 绿道/CDS/评估/WebSocket
    location /api/v3/greenway {
        proxy_pass http://core-clinical:8081;
        proxy_set_header Host $host;
    }
    location /api/v3/decisions {
        proxy_pass http://core-clinical:8081;
        proxy_set_header Host $host;
    }
    location /api/v3/assessments {
        proxy_pass http://core-clinical:8081;
        proxy_set_header Host $host;
    }
    location /api/v3/health {
        proxy_pass http://core-clinical:8081;
        proxy_set_header Host $host;
    }
    # WebSocket 告警推送
    location /api/v3/ws/alerts {
        proxy_pass http://core-clinical:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # infrastructure (认证 + 通知 + 审计)
    location /api/v3/auth {
        proxy_pass http://infrastructure:8082;
        proxy_set_header Host $host;
    }
    location /api/v3/infra {
        proxy_pass http://infrastructure:8082;
        proxy_set_header Host $host;
    }

    # integration
    location /api/v3/integration {
        proxy_pass http://integration:8083;
        proxy_set_header Host $host;
    }

    # rehab-followup
    location /api/v3/followup {
        proxy_pass http://rehab-followup:8084;
        proxy_set_header Host $host;
    }

    # analytics
    location /api/v3/dashboard {
        proxy_pass http://analytics:8085;
        proxy_set_header Host $host;
    }
}
