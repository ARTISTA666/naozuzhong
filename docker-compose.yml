# ============================================================
# 脑卒中疾病管理医疗系统 — Docker Compose
# 一键启动：docker compose up -d
# ============================================================

# version: 已弃用（移除避免警告）

services:

  # ==================== 基础设施 ====================

  db:
    image: mariadb:10.11
    container_name: stroke-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: stroke-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== 后端服务 ====================

  core-clinical:
    build: .
    image: stroke-platform:latest
    container_name: stroke-clinical
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stroke_clinical?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
    command: ["/app/core-clinical.jar"]

  infrastructure:
    build: .
    image: stroke-platform:latest
    container_name: stroke-infra
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stroke_infra?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    command: ["/app/infrastructure.jar"]

  integration:
    build: .
    image: stroke-platform:latest
    container_name: stroke-integration
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stroke_integration?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    command: ["/app/integration.jar"]

  rehab-followup:
    build: .
    image: stroke-platform:latest
    container_name: stroke-rehab
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stroke_rehab?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    command: ["/app/rehab-followup.jar"]

  analytics:
    build: .
    image: stroke-platform:latest
    container_name: stroke-analytics
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8085:8085"
    command: ["/app/analytics.jar"]

  # ==================== 前端 + 网关 ====================

  gateway:
    image: nginx:alpine
    container_name: stroke-gateway
    restart: unless-stopped
    depends_on:
      - core-clinical
      - infrastructure
      - integration
      - rehab-followup
      - analytics
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf

  frontend:
    build: ./frontend
    container_name: stroke-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"

volumes:
  mysql-data:
    driver: local
