apiVersion: apps/v1
kind: Deployment
metadata:
  name: stroke-gateway
  namespace: stroke
spec:
  replicas: 2
  selector:
    matchLabels: { app: stroke-gateway }
  template:
    metadata:
      labels: { app: stroke-gateway }
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: config
          configMap:
            name: stroke-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: stroke-gateway
  namespace: stroke
spec:
  selector: { app: stroke-gateway }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stroke-frontend
  namespace: stroke
spec:
  replicas: 2
  selector:
    matchLabels: { app: stroke-frontend }
  template:
    metadata:
      labels: { app: stroke-frontend }
    spec:
      containers:
        - name: frontend
          image: naozuzhong-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: stroke-frontend
  namespace: stroke
spec:
  type: LoadBalancer
  selector: { app: stroke-frontend }
  ports:
    - port: 80
      targetPort: 80
